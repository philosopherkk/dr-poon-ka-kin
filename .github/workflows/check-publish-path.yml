name: Check publish path

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Default branch and version string
        run: |
          node --test scripts/check-publish-path.test.mjs
          node scripts/check-publish-path.mjs
